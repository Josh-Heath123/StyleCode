# Licence and copyright for every file in the repository (REUSE Specification 3.3, https://reuse.software/spec-3.3/).
# StyleCode is the owner's own work, under the PolyForm Strict License 1.0.0 (LICENSE). PolyForm Strict isn't on the
# SPDX licence list, so its identifier is a LicenseRef, with its text in LICENSES/. Third-party code isn't in the
# repository: it's installed by npm or downloaded by the transcription setup. THIRD-PARTY-NOTICES.md quotes their
# licences, so it says whose those texts are. When several annotations match a file, the last one counts.
version = 1

[[annotations]]
path = "**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Joshua Heath"
SPDX-License-Identifier = "LicenseRef-PolyForm-Strict-1.0.0"

[[annotations]]
path = "THIRD-PARTY-NOTICES.md"
precedence = "override"
SPDX-FileCopyrightText = [
  "2026 Joshua Heath",
  "Meta Platforms, Inc. and affiliates",
  "2016 The Inter Project Authors",
]
SPDX-License-Identifier = "LicenseRef-PolyForm-Strict-1.0.0 AND MIT AND OFL-1.1"
