<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>StyleCode: the social preview</title>
    <!--
      The repository's social preview (docs/presentation/PRESENTATION-BRIEF.md, P5 and P8), 1280×640 as GitHub asks.
      Rendered to docs/media/social-preview.png by `npm run demos -- brand` at 1×, so the file is exactly 1280×640; the
      owner uploads it in Settings → General → Social preview. One orange element only: the mark's dot.
    -->
    <link rel="stylesheet" href="../../src/styles/app.css" />
    <link rel="stylesheet" href="brand.css" />
    <style>
      html,
      body {
        width: 1280px;
        height: 640px;
      }

      .grid {
        mask-image: radial-gradient(ellipse at 30% 40%, black 30%, transparent 80%);
      }

      /* One guide at the italic's angle, through the wordmark's first letter. */
      .slant {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 248px;
        width: 1px;
        background: var(--grid-guide);
        transform: skewX(-10deg);
        transform-origin: 0 300px;
        mask-image: linear-gradient(180deg, black 0, black 340px, transparent 380px);
      }

      main {
        position: absolute;
        left: 88px;
        right: 88px;
        top: 50%;
        transform: translateY(-50%);
      }

      .lockup {
        display: flex;
        align-items: center;
        gap: 28px;
      }
      .mark {
        width: 112px;
        height: 112px;
        flex: none;
      }
      .wordmark {
        font-size: 136px;
      }

      .line {
        margin: 36px 0 0;
        max-width: 1000px;
        font-size: 32px;
        line-height: 1.3;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      .line span {
        color: var(--text-muted);
      }

      .labels {
        display: flex;
        gap: 18px;
        margin: 32px 0 0;
        padding: 0;
        list-style: none;
        font-size: 16px;
      }
      .labels li + li::before {
        content: '·';
        margin-right: 18px;
        color: var(--text-subtle);
      }
    </style>
  </head>
  <body>
    <div class="grid" aria-hidden="true"></div>
    <div class="slant" aria-hidden="true"></div>
    <main>
      <div class="lockup">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect class="mark-square" x="5" y="5" width="15" height="15" rx="3" fill="none" stroke-width="2.6" />
          <circle class="mark-dot" cx="21.5" cy="21.5" r="6" />
        </svg>
        <h1 class="display wordmark">StyleCode</h1>
      </div>
      <p class="line">
        A local-first workspace for software consultants.
        <span>From a conversation recorded with consent, to a reviewed record and the interface.</span>
      </p>
      <ul class="labels caps">
        <li>Local-first</li>
        <li>Consent-first</li>
        <li>The AI proposes, you decide</li>
      </ul>
    </main>
  </body>
</html>
